aid: bayesian-health
name: Bayesian Health
description: >-
  Bayesian Health is a real-time clinical intelligence company whose adaptive AI
  platform monitors hospitalized patients continuously inside the electronic
  health record, surfacing only the patients who need attention and giving
  clinicians evidence-based guidance to act. Its flagship Targeted Real-Time
  Early Warning System (TREWS) reads full patient charts — labs, vitals, and
  clinical notes — to detect sepsis and other deterioration hours earlier while
  cutting alert volume, and in May 2026 became the first-ever FDA-cleared
  continuous AI sepsis monitor. Founded by Johns Hopkins professor Suchi Saria,
  the company deploys through direct EHR partnerships with Epic and Cerner
  rather than a public developer API, and is backed by a16z.
